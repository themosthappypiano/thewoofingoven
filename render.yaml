services:
  - type: web
    name: thewoofingoven
    env: node
    plan: free
    rootDir: ./
    buildCommand: npm ci --production=false && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.20.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: VITE_PAWS_VENEZUELA_ONE_BISCUIT_URL
        sync: false
      - key: VITE_PAWS_VENEZUELA_TWO_BISCUITS_URL
        sync: false
      - key: VITE_PAWS_VENEZUELA_DONATION_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

databases:
  - name: thewoofingoven-db
    databaseName: thewoofingoven
    user: thewoofingoven
    plan: free
